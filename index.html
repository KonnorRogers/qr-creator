<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>QR code creator demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="demo/style.css">
    <script type="module">
      import canvasToSvg from "https://esm.sh/canvas-to-svg";
      import QrCreator from './src/qr-creator.js';

      let availableSettings = ['text', 'radius', 'ecLevel', 'fill', 'background', 'size', 'image', 'imageEcCover', 'cornerFill', 'imageBackground'];

      function readSettings() {
        let settings = {}, el;
        for (let setting of availableSettings) {
          const value = document.querySelector('#'+setting).value;
          if (value) {
            settings[setting] = value
          }
        }
        if (document.querySelector('#transparent').checked) {
          settings.background = null;
        }
        return settings;
      }

      // Hopefully this won't be needed once this merges:
      // https://github.com/tone-row/canvas-to-svg/pull/6
      function patchArcTo(ctx) {
        ctx.arcTo = function (x1, y1, x2, y2, r) {
          const x0 = this.__currentPosition.x, y0 = this.__currentPosition.y;
          const a = [x0 - x1, y0 - y1], b = [x2 - x1, y2 - y1];
          const na = Math.hypot(a[0], a[1]), nb = Math.hypot(b[0], b[1]);
          if (na === 0 || nb === 0 || r === 0) { this.lineTo(x1, y1); return; }

          const ua = [a[0] / na, a[1] / na], ub = [b[0] / nb, b[1] / nb];
          let cos = ua[0] * ub[0] + ua[1] * ub[1];
          cos = Math.max(-1, Math.min(1, cos));
          const ang = Math.acos(cos);
          if (Math.abs(ang) < 1e-9 || Math.abs(ang - Math.PI) < 1e-9) { this.lineTo(x1, y1); return; }

          const distEdge = r / Math.tan(ang / 2);
          const t1 = [x1 + ua[0] * distEdge, y1 + ua[1] * distEdge]; // tangent point on incoming edge
          const t2 = [x1 + ub[0] * distEdge, y1 + ub[1] * distEdge]; // tangent point on outgoing edge

          const bis = [ua[0] + ub[0], ua[1] + ub[1]];
          const nbis = Math.hypot(bis[0], bis[1]);
          const ubis = [bis[0] / nbis, bis[1] / nbis];
          const cdist = r / Math.sin(ang / 2);
          const c = [x1 + ubis[0] * cdist, y1 + ubis[1] * cdist];    // arc center

          // Choose the sweep whose arc midpoint sits nearest the corner (rounds it off).
          const a1 = Math.atan2(t1[1] - c[1], t1[0] - c[0]);
          const a2 = Math.atan2(t2[1] - c[1], t2[0] - c[0]);
          const midOf = (s) => {
            let d = a2 - a1;
            if (s) { if (d < 0) d += 2 * Math.PI; } else { if (d > 0) d -= 2 * Math.PI; }
            const m = a1 + d / 2;
            return [c[0] + r * Math.cos(m), c[1] + r * Math.sin(m)];
          };
          const dP1 = (p) => Math.hypot(p[0] - x1, p[1] - y1);
          const sweep = dP1(midOf(1)) < dP1(midOf(0)) ? 1 : 0;

          this.lineTo(t1[0], t1[1]);
          this.__addPathCommand(`A ${r} ${r} 0 0 ${sweep} ${t2[0]} ${t2[1]}`);
          this.__currentPosition = { x: t2[0], y: t2[1] };
        };
        return ctx;
      }

      function renderQrCode() {
        let time = new Date(),
            container = document.querySelector('#qr-code'),
            settings = readSettings();
        container.innerHTML = '';
        QrCreator.render(settings, container);
        document.querySelector('#stats').innerText = 'Rendered in ' + (new Date()-time) + 'ms';
        document.querySelector('#json').innerText = JSON.stringify(settings, null, 2);

        const size = 256 * 2
        const context = new canvasToSvg(size, size);
        patchArcTo(context)
        QrCreator.render({...settings, context: context, size })
        const svg = context.getSerializedSvg(true)
        document.querySelector("#svg").innerHTML = svg
        document.querySelector("#svg-output").textContent = svg
      }

      for (let input of document.querySelectorAll('input, select')) {
        input.addEventListener('change', renderQrCode);
      }
      renderQrCode();


    </script>
</head>

<body class="state-loading">
  <header>
    <h1>QR code creator demo</h1>
  </header>
  <main>
    <section>
    </section>
    <section id="qr-code">
    </section>
    <section id="stats">
    </section>
    <div id="tools-and-params">
      <section id="tools">
        <label>Text: <input id="text" type="text" value="Hello world of QR codes!"></label>
        <label>Radius: <input id="radius" type="range" value="0.5" step="0.025" min="0" max="0.5"></label>
        <label>Error correction:
        <select id="ecLevel">
          <option value="L" label="Low, 7%">
          <option value="M" label="Medium, 15%">
          <option value="Q" label="Quarter, 25%">
          <option value="H" label="High, 30%" selected>
        </select></label>
        <label>Color: <input id="fill" type="color" value="#0064a8"></label>
        <label>Corner Color: <input id="cornerFill" type="color" value="#434FCE"></label>
        <label>Background: <input id="background" type="color"><input id="transparent" type="checkbox" checked> transparent</label>
        <label>Size: <input id="size" type="range" value="250" step="10" min="20" max="1000"></label>
        <label>URL for Image: <input id="image" type="url"></label>
        <label>Image Error Correction Cover: <input id="imageEcCover" type="number" min="0" max="1" step="0.05" value="0.5"></label>
        <label>Image Background: <input id="imageBackground" type="color" value="#fff"></label>
      </section>
      <section id="parameters">
        <label>Parameters:</label>
        <pre><code id="json"></code></pre>
      </section>
    </div>

    <div>
      SVG Rendering:

      <div id="svg">
      </div>

      <output><pre><code id="svg-output"></code></pre></output>
    </div>
  </main>
</body>
</html>
